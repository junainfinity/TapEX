worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Docker's embedded DNS. Upstreams are named through variables so nginx starts before they exist and follows a
  # recreated container (new IP after an upgrade) instead of pinning the address it resolved at start-up.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Security headers are included per location, never at server level: a server-level add_header would also be
    # inherited by the proxied /v1/ location and repeat the headers the house server already sets.
    location = /health { access_log off; default_type application/json; include /etc/nginx/maya-security-headers.conf; return 200 '{"status":"ok","product":"Maya-Live game"}'; }
    # Public price relay (same as the paper demo; the live chart itself is drawn from the house's /v1/path).
    location /api/ {
      set $relay http://feed-relay:8787;
      proxy_pass $relay;
      proxy_http_version 1.1;
      proxy_read_timeout 15s;
      proxy_set_header Host $host;
      add_header Cache-Control no-store always;
    }
    # $OPEN house player API: chain config, promo, path, quotes, bets, account, withdrawals and SIWE sessions (the
    # maya_session cookie passes through unchanged). Unbuffered, so any streamed response reaches the player at once.
    # The admin API is not routed here: /admin-api only exists on the console's origin.
    location /v1/ {
      set $house http://house-server:8790;
      proxy_pass $house;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      # Overwritten, never appended: the house server does not trust these yet (per-IP sign-in limits count the proxy).
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
      # No add_header here: the house server sets Cache-Control no-store, nosniff, no-referrer, DENY, CSP and CORP on
      # every response, and a duplicate from nginx would only repeat them.
    }
    location /assets/ { try_files $uri =404; expires 1y; include /etc/nginx/maya-security-headers.conf; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; include /etc/nginx/maya-security-headers.conf; add_header Cache-Control no-cache; }
  }
}
