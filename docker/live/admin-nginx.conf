worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  sendfile on;
  server_tokens off;
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  # Docker's embedded DNS; the house server is named through a variable so a recreated container is followed.
  resolver 127.0.0.11 valid=10s ipv6=off;
  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # Security headers per location only (see game-nginx.conf): the proxied locations get them from the house server.
    location = /health { access_log off; default_type application/json; include /etc/nginx/maya-security-headers.conf; return 200 '{"status":"ok","product":"Maya-Live admin"}'; }
    # SSE and JSON admin API (bearer token); buffering off so the live stream is not held back.
    location /admin-api/ {
      set $house http://house-server:8790;
      proxy_pass $house;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_buffering off;
      proxy_cache off;
      proxy_read_timeout 1h;
    }
    # The console's escape-hatch proof lookup (GET /v1/account/<address>/proof), same as its Vite dev proxy. Only this
    # route of the player API is reachable from the console's origin.
    location ~ ^/v1/account/[^/]+/proof$ {
      limit_except GET { deny all; }
      set $house http://house-server:8790;
      proxy_pass $house;
      proxy_http_version 1.1;
      proxy_set_header Connection '';
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_read_timeout 30s;
    }
    location /v1/ { include /etc/nginx/maya-security-headers.conf; return 404; }
    location /assets/ { try_files $uri =404; expires 1y; include /etc/nginx/maya-security-headers.conf; add_header Cache-Control "public, immutable"; }
    location / { try_files $uri $uri/ /index.html; include /etc/nginx/maya-security-headers.conf; add_header Cache-Control no-cache; }
  }
}
