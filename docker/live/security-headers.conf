# Included in every location of docker/live/{game,admin}-nginx.conf. nginx drops server-level add_header directives
# in any location that sets its own add_header (e.g. Cache-Control), so the headers are repeated per location here.
add_header X-Content-Type-Options nosniff always;
add_header X-Frame-Options DENY always;
add_header Referrer-Policy no-referrer always;
